name: SDOH November 2026 — remaining 10 carousel QA batch (manual only)

# One manual dispatch fans out exactly 10 previously Owner-copy-approved items
# into the existing seasonal QA workflow. Nothing schedules, posts, publishes,
# changes production activation or grants Owner Final Visual Approval.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter RENDER_REMAINING_10_QA_ONLY to render 10 review artifacts
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  qa-batch:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RENDER_REMAINING_10_QA_ONLY'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - content_id: SDOH-BURGUNDY-CAR-0018
            expected_copy_fingerprint: 35123c6ac4fe506d0a2a1852889cce69383c8f2b180832ec00f415b6a2ee222b
            target_date: 2026-11-13
          - content_id: SDOH-SAGE-CAR-0017
            expected_copy_fingerprint: 2d918b8d889e1cb49c02b9675a8a60a85b5a483e39d2d83402ab8a0301b1676c
            target_date: 2026-11-15
          - content_id: SDOH-BURGUNDY-CAR-0019
            expected_copy_fingerprint: 017349eef4343d112ca024fbd9811c2856933ef58b3899eafa0c428ce5807992
            target_date: 2026-11-17
          - content_id: SDOH-SAGE-CAR-0018
            expected_copy_fingerprint: 02962c07164093602b561439c8730ec9fbc364ce9131ba35aeeeeaf3ef668163
            target_date: 2026-11-18
          - content_id: SDOH-BURGUNDY-CAR-0020
            expected_copy_fingerprint: 689a5866cbb66bbe0a6b11672e28fde61daa026e1d3d72f432d9387877842a35
            target_date: 2026-11-20
          - content_id: SDOH-SAGE-CAR-0019
            expected_copy_fingerprint: 8e75bed82764c6389a00439d4f0b9d3018863e90c665157e723a98ee28d477d9
