name: Validate Content OS documents

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate governed documents
        run: python validators/validate_documents.py
      - name: Self-test SDOH publication authority gate
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-authority-gate.mjs --self-test
      - name: Self-test SDOH Instagram carousel executor
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/instagram-carousel-self-test.mjs
      - name: Self-test ambiguous publish reconciliation
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/ambiguous-publish-reconciliation-self-test.mjs
      - name: Self-test immutable execution authority
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/execution-authority-self-test.mjs
      - name: Self-test live Linear authority preflight
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/live-authority-preflight.mjs --self-test
      - name: Self-test controlled runtime staging
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/controlled-staging-self-test.mjs
      - name: Self-test guarded runtime refresh
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/runtime-refresh-self-test.mjs
      - name: Self-test publication evidence writeback planner
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-evidence-writeback.mjs --self-test
      - name: Self-test controlled publication evidence writeback
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-evidence-writeback-controlled.mjs --self-test
      - name: Self-test scheduled execution fail-closed gates
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/scheduled-execution-self-test.mjs
      - name: Self-test scheduled publication discovery
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/scheduled-publication-discovery.mjs --self-test
      - name: Self-test SDOH model generation contract
        run: node projects/sdoh/runtime/automated-content-production/scripts/model-generation-contract-self-test.mjs
