name: Validate Content OS documents

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js 22 (node:sqlite for runtime safety tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate governed documents
        run: python validators/validate_documents.py
      - name: Self-test SDOH publication authority gate
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-authority-gate.mjs --self-test
      - name: Self-test SDOH Instagram carousel executor
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/instagram-carousel-self-test.mjs
      - name: Self-test ambiguous publish reconciliation
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/ambiguous-publish-reconciliation-self-test.mjs
      - name: Self-test immutable execution authority
        run: node --experimental-default-type=module projects/sdoh/runtime/instagram-publication-executor/scripts/execution-authority-self-test.mjs
      - name: Self-test cross-job guard, live account check and publish-attempt CAS
        run: node --no-warnings projects/sdoh/runtime/instagram-publication-executor/scripts/runtime-duplicate-safety-self-test.mjs
      - name: Self-test media gateway SHA-256 verification
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/media-gateway-sha-self-test.mjs
      - name: Self-test live Linear authority preflight
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/live-authority-preflight.mjs --self-test
      - name: Self-test controlled runtime staging
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/controlled-staging-self-test.mjs
      - name: Self-test guarded runtime refresh
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/runtime-refresh-self-test.mjs
      - name: Self-test publication evidence writeback planner
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-evidence-writeback.mjs --self-test
      - name: Self-test controlled publication evidence writeback
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/publication-evidence-writeback-controlled.mjs --self-test
      - name: Self-test writeback round-trip probe
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/writeback-roundtrip-probe.mjs --self-test
      - name: Self-test scheduled execution fail-closed gates
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/scheduled-execution-self-test.mjs
      - name: Self-test scheduled publication discovery
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/scheduled-publication-discovery.mjs --self-test
      - name: Self-test Cloudflare scheduled wake-up
        run: node projects/sdoh/runtime/instagram-publication-executor/scripts/scheduled-wakeup-self-test.mjs
      - name: Self-test SDOH model generation contract
        run: node projects/sdoh/runtime/automated-content-production/scripts/model-generation-contract-self-test.mjs
      - name: Self-test SDOH OpenAI generation adapter
        run: node projects/sdoh/runtime/automated-content-production/scripts/openai-generation-adapter-self-test.mjs
      - name: Self-test SDOH Cloudflare Workers AI generation adapter
        run: node projects/sdoh/runtime/automated-content-production/scripts/cloudflare-workers-ai-generation-adapter-self-test.mjs
      - name: Self-test BUS-144 automated-generation pilot request
        run: node projects/sdoh/runtime/automated-content-production/scripts/bus144-pilot-request-self-test.mjs
      - name: Self-test SDOH carousel render authority
        run: node projects/sdoh/runtime/automated-content-production/scripts/verify-carousel-render-authority.mjs
      - name: Self-test SDOH automated carousel render
        run: node projects/sdoh/runtime/automated-content-production/scripts/automated-carousel-render-self-test.mjs
      - name: Self-test SDOH retry canonical-fingerprint integrity
        run: node projects/sdoh/runtime/automated-content-production/scripts/retry-fingerprint-self-test.mjs
      - name: Self-test SDOH deterministic remediation and gate observability
        run: node projects/sdoh/runtime/automated-content-production/scripts/remediation-hint-self-test.mjs
      - name: Self-test SDOH approved-copy Production Path
        run: node projects/sdoh/runtime/automated-content-production/scripts/approved-copy-production-self-test.mjs
