name: SDOH prepare bridge readiness

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Existing non-publishing D1 smoke-test job ID"
        required: true
        default: "BUS90-PREPARE-SMOKE-001"
        type: string
      worker_base_url:
        description: "Active Cloudflare Worker base URL, e.g. https://<worker>.<subdomain>.workers.dev"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prepare-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          EXECUTOR_INGEST_SECRET: ${{ secrets.EXECUTOR_INGEST_SECRET }}
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
          test -n "$EXECUTOR_INGEST_SECRET"
          test -n "$JOB_ID"

          case "$WORKER_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::worker_base_url must use HTTPS"
              exit 1
              ;;
          esac

          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]]; then
            echo "::error::Invalid job_id"
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Handoff short-lived Drive credential
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXECUTOR_INGEST_SECRET: ${{ secrets.EXECUTOR_INGEST_SECRET }}
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
          JOB_ID: ${{ inputs.job_id }}
          GOVERNANCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "::add-mask::$GOOGLE_ACCESS_TOKEN"

          expires_at="$(date -u -d '+55 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          endpoint="${WORKER_BASE_URL%/}/internal/prepare"
          response_file="$RUNNER_TEMP/prepare-response.json"

          http_status="$(
            jq -n \
              --arg job_id "$JOB_ID" \
              --arg drive_access_token "$GOOGLE_ACCESS_TOKEN" \
              --arg drive_token_expires_at "$expires_at" \
              --arg governance_ref "$GOVERNANCE_REF" \
              '{
                job_id: $job_id,
                drive_access_token: $drive_access_token,
                drive_token_expires_at: $drive_token_expires_at,
                governance_ref: $governance_ref
              }' |
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $EXECUTOR_INGEST_SECRET" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              "$endpoint"
          )"

          if [ "$http_status" != "201" ]; then
            error_code="$(jq -r '.error // "UNKNOWN_ERROR"' "$response_file" 2>/dev/null || true)"
            echo "::error::Prepare bridge failed with HTTP $http_status ($error_code)"
            rm -f "$response_file"
            exit 1
          fi

          if [ "$(jq -r '.ok' "$response_file")" != "true" ] || \
             [ "$(jq -r '.credential_stored' "$response_file")" != "true" ] || \
             [ "$(jq -r '.job_id' "$response_file")" != "$JOB_ID" ]; then
            echo "::error::Prepare bridge response did not satisfy readiness contract"
            rm -f "$response_file"
            exit 1
          fi

          if jq -e 'has("drive_access_token") or has("drive_token_ciphertext")' "$response_file" >/dev/null; then
            echo "::error::Prepare response exposed credential material"
            rm -f "$response_file"
            exit 1
          fi

          echo "Prepare bridge readiness PASS"
          echo "job_id=$JOB_ID"
          echo "governance_ref=$GOVERNANCE_REF"
          echo "drive_token_expires_at=$expires_at"

          rm -f "$response_file"
