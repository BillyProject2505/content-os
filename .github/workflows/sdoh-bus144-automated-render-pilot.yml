name: SDOH BUS-144 automated render pilot

on:
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: Successful generation run containing the exact candidate
        required: true
        default: "37089189231"
        type: string
      expected_response_fingerprint:
        description: Exact BUS-161 candidate response fingerprint
        required: true
        default: "13d358fdc3cd45be106e8a67468bc770ec575bb855ef92ac16988b7f3996cb6a"
        type: string
      confirmation:
        description: Type RENDER_UNAPPROVED_REVIEW_PACKAGE
        required: true
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate pilot inputs
        shell: bash
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GENERATION_RUN_ID" = "37089189231"
          test "$EXPECTED_RESPONSE_FINGERPRINT" = "13d358fdc3cd45be106e8a67468bc770ec575bb855ef92ac16988b7f3996cb6a"
          test "$CONFIRMATION" = "RENDER_UNAPPROVED_REVIEW_PACKAGE"
          echo "BUS-144 render authorization PASS"

      - name: Download exact generation candidate
        uses: actions/download-artifact@v4
        with:
          name: SDOH-SAGE-CAR-0009-unapproved-generation
          path: ${{ runner.temp }}/generation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.generation_run_id }}

      - name: Verify exact candidate artifact
        shell: bash
        env:
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"
          test -s "$candidate"
          jq -e --arg fp "$EXPECTED_RESPONSE_FINGERPRINT" '
            .content_id == "SDOH-SAGE-CAR-0009" and
            .generation_metadata.provider == "cloudflare-workers-ai" and
            .generation_metadata.response_fingerprint == $fp and
            (.slides | length) == 5 and
            (has("approval") | not) and
            (has("publication_state") | not)
          ' "$candidate" >/dev/null
          echo "Exact candidate artifact PASS"

      - name: Verify runtime authority against canonical Asset Registry
        run: node projects/sdoh/runtime/automated-content-production/scripts/verify-carousel-render-authority.mjs

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Authenticate to Google Cloud with WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s

      - name: Fetch canonical BUS-49 renderer, font, and pose binaries
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          cfg="projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json"
          root="$RUNNER_TEMP/render-input"
          char_dir="$root/characters"
          mkdir -p "$char_dir"

          download_drive() {
            local file_id="$1"
            local output="$2"
            local expected_sha="$3"
            local label="$4"

            local status
            status="$(curl --silent --show-error --location               --output "$output"               --write-out "%{http_code}"               --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"               "https://www.googleapis.com/drive/v3/files/$file_id?alt=media")"

            if [ "$status" != "200" ] || [ ! -s "$output" ]; then
              echo "::error::$label Drive fetch failed (HTTP $status)"
              exit 1
            fi

            actual="$(sha256sum "$output" | awk '{print $1}')"
            if [ "$actual" != "$expected_sha" ]; then
              echo "::error::$label SHA-256 mismatch"
              exit 1
            fi
            echo "$label SHA-256 PASS"
          }

          download_drive             "$(jq -r '.renderer.drive_file_id' "$cfg")"             "$root/renderer.zip"             "$(jq -r '.renderer.sha256' "$cfg")"             "BUS-49 v0.6.0 renderer"

          download_drive             "$(jq -r '.font.drive_file_id' "$cfg")"             "$root/Caveat-Medium.ttf"             "$(jq -r '.font.sha256' "$cfg")"             "Caveat Medium"

          for pose in P02 P03 P05 P06 P07; do
            file_id="$(jq -r --arg p "$pose" '.poses[$p].drive_file_id' "$cfg")"
            expected_sha="$(jq -r --arg p "$pose" '.poses[$p].sha256' "$cfg")"
            filename="$(jq -r --arg p "$pose" '.poses[$p].expected_filename' "$cfg")"
            download_drive "$file_id" "$char_dir/$filename" "$expected_sha" "$pose"
          done

          mkdir -p "$root/renderer"
          unzip -q "$root/renderer.zip" -d "$root/renderer"
          test -f "$root/renderer/bus49_v060canonical/renderer.py"

      - name: Install and verify canonical render environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow==12.3.0
          python - <<'PY'
          import sys
          from PIL import __version__, features
          assert sys.version.startswith("3.13.5"), sys.version
          assert __version__ == "12.3.0", __version__
          assert features.version("freetype2") == "2.14.3", features.version("freetype2")
          assert features.version("raqm") == "0.10.5", features.version("raqm")
          print("Canonical renderer environment PASS")
          PY

      - name: Build deterministic BUS-144 render manifest
        shell: bash
        env:
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
        run: |
          set -euo pipefail
          node projects/sdoh/runtime/automated-content-production/scripts/build-carousel-render-manifest.mjs             --candidate "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"             --request projects/sdoh/runtime/automated-content-production/pilot-requests/SDOH-SAGE-CAR-0009.json             --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json             --expected-response-fingerprint "$EXPECTED_RESPONSE_FINGERPRINT"             --out "$RUNNER_TEMP/render_manifest.json"

      - name: Render BUS-49 v0.6.0 review candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/render-input"
          out="$RUNNER_TEMP/review/rendered"
          mkdir -p "$out"
          python "$root/renderer/bus49_v060canonical/renderer.py"             --content "$RUNNER_TEMP/render_manifest.json"             --font "$root/Caveat-Medium.ttf"             --character-dir "$root/characters"             --out "$out"

      - name: Technical QA and assemble review evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          cp "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json" "$RUNNER_TEMP/review/"
          cp "$RUNNER_TEMP/render_manifest.json" "$RUNNER_TEMP/review/"
          cp projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json "$RUNNER_TEMP/review/"

          node projects/sdoh/runtime/automated-content-production/scripts/validate-carousel-review-package.mjs             --report "$RUNNER_TEMP/review/rendered/render_report.json"             --manifest "$RUNNER_TEMP/render_manifest.json"             --candidate "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"             --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json             --out "$RUNNER_TEMP/review/review_package.json"

      - name: Build contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          files=sorted(Path("${{ runner.temp }}/review/rendered").glob("*.jpg"))
          assert len(files)==5
          cells=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              im.thumbnail((324,405))
              c=Image.new("RGB",(344,445),"white")
              c.paste(im,((344-im.width)//2,10))
              ImageDraw.Draw(c).text((10,420),p.name,fill="black")
              cells.append(c)
          sheet=Image.new("RGB",(344*5,445),"white")
          for i,c in enumerate(cells):
              sheet.paste(c,(i*344,0))
          sheet.save("${{ runner.temp }}/review/SDOH-SAGE-CAR-0009_contact_sheet.jpg",quality=92)
          PY

      - name: Final review-package fail-closed check
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .content_id == "SDOH-SAGE-CAR-0009" and
            .state == "READY_FOR_OWNER_REVIEW" and
            .approval == "NOT_GRANTED" and
            .publication_state == "PLANNED" and
            .technical_qa.result == "PASS" and
            (.outputs | length) == 5
          ' "$RUNNER_TEMP/review/review_package.json" >/dev/null
          echo "Review package READY_FOR_OWNER_REVIEW"
          echo "Owner approval NOT GRANTED"
          echo "Publication state remains PLANNED"

      - name: Upload BUS-144 review package
        uses: actions/upload-artifact@v4
        with:
          name: SDOH-SAGE-CAR-0009-owner-review-package
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/review/review_package.json"
          {
            echo "## BUS-144 automated render pilot"
            echo
            echo "- State: READY_FOR_OWNER_REVIEW"
            echo "- Owner approval: NOT GRANTED"
            echo "- Publication state: PLANNED"
            echo "- Renderer: BUS-49 v0.6.0"
            echo "- Pose route: P02 → P03 → P05 → P06 → P07"
            echo "- Technical QA: PASS"
            echo "- Response fingerprint: $(jq -r '.source_candidate.response_fingerprint' "$pkg")"
          } >> "$GITHUB_STEP_SUMMARY"
