# OPTIONAL GENERATION PATH (experimental, not a production dependency).
# The canonical BUS-160 Production Path is sdoh-approved-copy-render.yml, which
# renders Owner/editor-approved copy from the repository and needs no model.
# This workflow only renders an unapproved AI-generation candidate artifact and
# remains manual (workflow_dispatch); nothing in the Production Path calls it.
name: SDOH BUS-144 automated render pilot

on:
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: Successful 'SDOH automated content generation pilot' run on main holding the candidate artifact
        required: true
        type: string
      expected_response_fingerprint:
        description: Exact BUS-161 response_fingerprint of that candidate (64 lowercase hex)
        required: true
        type: string
      confirmation:
        description: Type RENDER_UNAPPROVED_REVIEW_PACKAGE
        required: true
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate pilot inputs
        shell: bash
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$GENERATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::generation_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi
          if ! [[ "$EXPECTED_RESPONSE_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected_response_fingerprint must be 64 lowercase hex characters"
            exit 1
          fi
          if [ "$CONFIRMATION" != "RENDER_UNAPPROVED_REVIEW_PACKAGE" ]; then
            echo "::error::Exact confirmation is required"
            exit 1
          fi
          echo "BUS-144 render input format PASS"

      - name: Verify generation run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GENERATION_RUN_ID}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .path == ".github/workflows/sdoh-automated-content-generation-pilot.yml" and
            .head_branch == "main" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success"
          ' <<<"$run_json" >/dev/null || {
            echo "::error::Run ${GENERATION_RUN_ID} is not a successful main-branch generation pilot run"
            exit 1
          }
          echo "Generation run ${GENERATION_RUN_ID} provenance PASS (head $(jq -r '.head_sha' <<<"$run_json"))"

      - name: Download exact generation candidate
        uses: actions/download-artifact@v4
        with:
          name: SDOH-SAGE-CAR-0009-unapproved-generation
          path: ${{ runner.temp }}/generation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.generation_run_id }}

      - name: Verify exact candidate artifact
        shell: bash
        env:
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"
          test -s "$candidate"
          jq -e --arg fp "$EXPECTED_RESPONSE_FINGERPRINT" '
            .content_id == "SDOH-SAGE-CAR-0009" and
            .generation_metadata.provider == "cloudflare-workers-ai" and
            .generation_metadata.response_fingerprint == $fp and
            (.slides | length) == 5 and
            (has("approval") | not) and
            (has("publication_state") | not)
          ' "$candidate" >/dev/null
          echo "Exact candidate artifact PASS"

      - name: Verify runtime authority against canonical Asset Registry
        run: node projects/sdoh/runtime/automated-content-production/scripts/verify-carousel-render-authority.mjs

      - name: Build deterministic BUS-144 render manifest
        shell: bash
        env:
          EXPECTED_RESPONSE_FINGERPRINT: ${{ inputs.expected_response_fingerprint }}
        run: |
          set -euo pipefail
          node projects/sdoh/runtime/automated-content-production/scripts/build-carousel-render-manifest.mjs             --candidate "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"             --request projects/sdoh/runtime/automated-content-production/pilot-requests/SDOH-SAGE-CAR-0009.json             --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json             --expected-response-fingerprint "$EXPECTED_RESPONSE_FINGERPRINT"             --out "$RUNNER_TEMP/render_manifest.json"

      - name: Authenticate to Google Cloud with WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s

      - name: Render with BUS-49 v0.6.0 (shared render action)
        uses: ./.github/actions/sdoh-bus49-render
        with:
          google_access_token: ${{ steps.auth.outputs.access_token }}
          manifest: ${{ runner.temp }}/render_manifest.json
          out_dir: ${{ runner.temp }}/review/rendered
          contact_sheet: ${{ runner.temp }}/review/SDOH-SAGE-CAR-0009_contact_sheet.jpg

      - name: Technical QA and assemble review evidence
        shell: bash
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          cp "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json" "$RUNNER_TEMP/review/"
          cp "$RUNNER_TEMP/render_manifest.json" "$RUNNER_TEMP/review/"
          cp projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json "$RUNNER_TEMP/review/"

          node projects/sdoh/runtime/automated-content-production/scripts/validate-carousel-review-package.mjs             --report "$RUNNER_TEMP/review/rendered/render_report.json"             --manifest "$RUNNER_TEMP/render_manifest.json"             --candidate "$RUNNER_TEMP/generation/SDOH-SAGE-CAR-0009_candidate.json"             --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json             --generation-run-id "$GENERATION_RUN_ID"             --out "$RUNNER_TEMP/review/review_package.json"

      - name: Final review-package fail-closed check
        shell: bash
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          set -euo pipefail
          jq -e --arg run_id "$GENERATION_RUN_ID" '
            .content_id == "SDOH-SAGE-CAR-0009" and
            .state == "READY_FOR_OWNER_REVIEW" and
            .approval == "NOT_GRANTED" and
            .publication_state == "PLANNED" and
            .technical_qa.result == "PASS" and
            .source_candidate.generation_run_id == $run_id and
            (.outputs | length) == 5
          ' "$RUNNER_TEMP/review/review_package.json" >/dev/null
          echo "Review package READY_FOR_OWNER_REVIEW"
          echo "Owner approval NOT GRANTED"
          echo "Publication state remains PLANNED"

      - name: Upload BUS-144 review package
        uses: actions/upload-artifact@v4
        with:
          name: SDOH-SAGE-CAR-0009-owner-review-package
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/review/review_package.json"
          {
            echo "## BUS-144 automated render pilot"
            echo
            echo "- State: READY_FOR_OWNER_REVIEW"
            echo "- Owner approval: NOT GRANTED"
            echo "- Publication state: PLANNED"
            echo "- Renderer: BUS-49 v0.6.0"
            echo "- Pose route: P02 → P03 → P05 → P06 → P07"
            echo "- Technical QA: PASS"
            echo "- Generation run: $(jq -r '.source_candidate.generation_run_id' "$pkg") (attempt $(jq -r '.source_candidate.generation_attempt' "$pkg"))"
            echo "- Request fingerprint: $(jq -r '.source_candidate.request_fingerprint' "$pkg")"
            echo "- Response fingerprint: $(jq -r '.source_candidate.response_fingerprint' "$pkg")"
          } >> "$GITHUB_STEP_SUMMARY"
