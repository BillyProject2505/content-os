name: SDOH approved-copy render (BUS-160 Production Path)

# BUS-160 canonical Production Path:
#   COPY_APPROVED copy in GitHub -> contract/status/integrity validation
#   -> Semantic Alignment gate -> Editorial Quality gate
#   -> deterministic visual plan -> BUS-49 render -> Technical QA
#   -> READY_FOR_OWNER_REVIEW  (hard stop)
#
# No model, generation provider, retry, prompt remediation or billing is used.
# This workflow never grants Owner approval, schedules, calls BUS-140 or
# publishes. Final visual approval is a separate explicit Owner action.

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: Content item with a COPY_APPROVED file under projects/sdoh/content/<theme>/carousel/
        required: true
        type: string
      expected_copy_fingerprint:
        description: copy_fingerprint of the approved copy recorded with the copy approval (64 lowercase hex)
        required: true
        type: string
      confirmation:
        description: Type RENDER_UNAPPROVED_REVIEW_PACKAGE
        required: true
        default: ""
        type: string
  workflow_call:
    inputs:
      content_id:
        required: true
        type: string
      expected_copy_fingerprint:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        shell: bash
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          EXPECTED_COPY_FINGERPRINT: ${{ inputs.expected_copy_fingerprint }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$CONTENT_ID" =~ ^SDOH-(SAGE|BURGUNDY)-CAR-[0-9]{4}$ ]]; then
            echo "::error::content_id must be an SDOH Sage/Burgundy Carousel ID"
            exit 1
          fi
          if ! [[ "$EXPECTED_COPY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected_copy_fingerprint must be 64 lowercase hex characters"
            exit 1
          fi
          if [ "$CONFIRMATION" != "RENDER_UNAPPROVED_REVIEW_PACKAGE" ]; then
            echo "::error::Exact confirmation is required"
            exit 1
          fi
          echo "Approved-copy render input format PASS"

      - name: Verify runtime authority against canonical Asset Registry
        run: node projects/sdoh/runtime/automated-content-production/scripts/verify-carousel-render-authority.mjs

      - name: Validate approved copy and build deterministic render manifest
        shell: bash
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          EXPECTED_COPY_FINGERPRINT: ${{ inputs.expected_copy_fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          if ! node projects/sdoh/runtime/automated-content-production/scripts/build-approved-copy-render-manifest.mjs --content-id "$CONTENT_ID" --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json --expected-copy-fingerprint "$EXPECTED_COPY_FINGERPRINT" --out "$RUNNER_TEMP/render_manifest.json" --snapshot-out "$RUNNER_TEMP/review/approved_copy.json" 2> "$RUNNER_TEMP/copy-rejection.txt"; then
            while IFS= read -r line; do echo "::error::${line}"; done < "$RUNNER_TEMP/copy-rejection.txt"
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s

      - name: Render with BUS-49 v0.6.0
        uses: ./.github/actions/sdoh-bus49-render
        with:
          google_access_token: ${{ steps.auth.outputs.access_token }}
          manifest: ${{ runner.temp }}/render_manifest.json
          out_dir: ${{ runner.temp }}/review/rendered
          contact_sheet: ${{ runner.temp }}/review/${{ inputs.content_id }}_contact_sheet.jpg

      - name: Technical QA and assemble review evidence
        shell: bash
        env:
          EXPECTED_COPY_FINGERPRINT: ${{ inputs.expected_copy_fingerprint }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/render_manifest.json" "$RUNNER_TEMP/review/"
          cp projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json "$RUNNER_TEMP/review/"
          node projects/sdoh/runtime/automated-content-production/scripts/validate-carousel-review-package.mjs --report "$RUNNER_TEMP/review/rendered/render_report.json" --manifest "$RUNNER_TEMP/render_manifest.json" --copy "$RUNNER_TEMP/review/approved_copy.json" --expected-copy-fingerprint "$EXPECTED_COPY_FINGERPRINT" --authority projects/sdoh/runtime/automated-content-production/render-runtime/carousel-v060-authority.json --out "$RUNNER_TEMP/review/review_package.json"

      - name: Final review-package fail-closed check
        shell: bash
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          EXPECTED_COPY_FINGERPRINT: ${{ inputs.expected_copy_fingerprint }}
        run: |
          set -euo pipefail
          jq -e --arg id "$CONTENT_ID" --arg fp "$EXPECTED_COPY_FINGERPRINT" '
            .content_id == $id and
            .production_path == "APPROVED_COPY" and
            .state == "READY_FOR_OWNER_REVIEW" and
            .approval == "NOT_GRANTED" and
            .publication_state == "PLANNED" and
            .technical_qa.result == "PASS" and
            .source_copy.status == "COPY_APPROVED" and
            .source_copy.copy_fingerprint == $fp and
            (.outputs | length) == 5
          ' "$RUNNER_TEMP/review/review_package.json" >/dev/null
          echo "Review package READY_FOR_OWNER_REVIEW"
          echo "Owner approval NOT GRANTED"
          echo "Publication state remains PLANNED"

      - name: Upload owner review package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.content_id }}-owner-review-package
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/review/review_package.json"
          {
            echo "## Approved-copy render (Production Path)"
            echo
            echo "- Content: $(jq -r '.content_id' "$pkg")"
            echo "- State: READY_FOR_OWNER_REVIEW"
            echo "- Owner approval: NOT GRANTED"
            echo "- Publication state: PLANNED"
            echo "- Renderer: BUS-49 v0.6.0"
            echo "- Pose route: $(jq -r '.visual_plan.pose_route | join(" → ")' "$pkg")"
            echo "- Technical QA: PASS"
            echo "- Copy fingerprint: $(jq -r '.source_copy.copy_fingerprint' "$pkg")"
          } >> "$GITHUB_STEP_SUMMARY"
