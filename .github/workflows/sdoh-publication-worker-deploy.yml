name: SDOH publication Worker production deploy

# Credential refresh trigger: 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - "projects/sdoh/runtime/instagram-publication-executor/**"
      - ".github/workflows/sdoh-publication-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdoh-publication-worker-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/sdoh/runtime/instagram-publication-executor
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate and normalize production deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f wrangler.jsonc

          clean_token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$clean_token"
          echo "::add-mask::$clean_token"
          {
            echo "CLOUDFLARE_API_TOKEN<<__CF_TOKEN__"
            printf '%s\n' "$clean_token"
            echo "__CF_TOKEN__"
          } >> "$GITHUB_ENV"
          echo "Cloudflare production deploy credentials/config normalized"

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true and .result.status == "active"' <<<"$response" >/dev/null || {
            echo "::error::Cloudflare API token verification failed"
            jq -c '{success,errors,result:{status:(.result.status // null)}}' <<<"$response"
            exit 1
          }
          echo "Cloudflare API token verification PASS"

      - name: Deploy canonical Worker to production
        shell: bash
        run: |
          set -euo pipefail
          # Tag the Worker version with the exact deployed commit so /health can
          # prove provenance through the version_metadata binding.
          npx --yes wrangler@4.147.0 deploy --config wrangler.jsonc \
            --tag "$GITHUB_SHA" \
            --message "content-os ${GITHUB_SHA} via sdoh-publication-worker-deploy run ${GITHUB_RUN_ID}"

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            https://sdoh-instagram-publication-executor.billyfernando2505.workers.dev/health)"
          echo "$response"
          jq -e '.ok == true' <<<"$response" >/dev/null
          echo "Production Worker health PASS"

      - name: Verify deployed version provenance
        shell: bash
        run: |
          set -euo pipefail
          # Fail if the live version is not tagged with this exact commit, e.g.
          # because another deploy path (Workers Builds) replaced it.
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error \
              https://sdoh-instagram-publication-executor.billyfernando2505.workers.dev/health)"
            tag="$(jq -r '.deployment.commit_sha // empty' <<<"$response")"
            if [ "$tag" = "$GITHUB_SHA" ]; then
              jq -c '.deployment' <<<"$response"
              echo "Deployed Worker provenance PASS: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          jq -c '.deployment' <<<"$response"
          echo "::error::Live Worker version is not tagged with $GITHUB_SHA (provenance UNVERIFIED)"
          exit 1
