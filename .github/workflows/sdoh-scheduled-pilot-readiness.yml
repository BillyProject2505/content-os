name: SDOH scheduled pilot readiness

on:
  workflow_dispatch:
    inputs:
      worker_base_url:
        description: Production Worker HTTPS base URL
        required: true
        default: https://sdoh-instagram-publication-executor.billyfernando2505.workers.dev

permissions:
  contents: read

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify manual publishing window remains closed
        shell: bash
        env:
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/health.json"
          http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" "${WORKER_BASE_URL%/}/health")"

          if [ "$http_status" != "200" ] || [ "$(jq -r '.ok' "$response_file")" != "true" ]; then
            echo "::error::Health check failed"
            exit 1
          fi

          if [ "$(jq -r '.publishing_enabled' "$response_file")" != "false" ]; then
            echo "::error::Manual publishing window must remain closed"
            exit 1
          fi

          echo "Manual publishing window CLOSED"

      - name: Resolve known terminal runtime job
        id: status
        shell: bash
        env:
          EXECUTOR_INGEST_SECRET: ${{ secrets.EXECUTOR_INGEST_SECRET }}
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/status.json"
          job_id="IG-SDOH-BURGUNDY-CAR-0001-20261002T040500Z"

          http_status="$(
            jq -n --arg job_id "$job_id" '{job_id:$job_id}' |
            curl --silent --show-error               --output "$response_file"               --write-out "%{http_code}"               --request POST               --header "Authorization: Bearer $EXECUTOR_INGEST_SECRET"               --header "Content-Type: application/json"               --data-binary @-               "${WORKER_BASE_URL%/}/internal/status"
          )"

          if [ "$http_status" != "200" ]; then
            echo "::error::Known terminal job status lookup failed with HTTP $http_status"
            exit 1
          fi

          jq -e --arg job_id "$job_id" '
            .ok == true and
            .job.id == $job_id and
            .job.state == "PUBLISHED" and
            (.job.governance_ref | test("^[0-9a-fA-F]{40}$"))
          ' "$response_file" >/dev/null

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "governance_ref=$(jq -r '.job.governance_ref' "$response_file")" >> "$GITHUB_OUTPUT"

      - name: Verify scheduled execute is enabled but terminal job remains ineligible
        shell: bash
        env:
          EXECUTOR_INGEST_SECRET: ${{ secrets.EXECUTOR_INGEST_SECRET }}
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
          JOB_ID: ${{ steps.status.outputs.job_id }}
          GOVERNANCE_REF: ${{ steps.status.outputs.governance_ref }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/execute.json"

          http_status="$(
            jq -n               --arg job_id "$JOB_ID"               --arg governance_ref "$GOVERNANCE_REF"               '{job_id:$job_id, governance_ref:$governance_ref, execution_mode:"SCHEDULED"}' |
            curl --silent --show-error               --output "$response_file"               --write-out "%{http_code}"               --request POST               --header "Authorization: Bearer $EXECUTOR_INGEST_SECRET"               --header "Content-Type: application/json"               --data-binary @-               "${WORKER_BASE_URL%/}/internal/execute"
          )"

          error_code="$(jq -r '.error // "UNKNOWN"' "$response_file")"
          if [ "$http_status" != "409" ] || [ "$error_code" != "JOB_STATE_REJECTED" ]; then
            echo "::error::Expected 409 JOB_STATE_REJECTED, got HTTP $http_status ($error_code)"
            exit 1
          fi

          echo "Scheduled execute readiness PASS"
          echo "Scheduled kill switch is active; terminal PUBLISHED job was rejected before executor/Meta."

      - name: Verify scheduled refresh is enabled but terminal job remains ineligible
        shell: bash
        env:
          EXECUTOR_INGEST_SECRET: ${{ secrets.EXECUTOR_INGEST_SECRET }}
          WORKER_BASE_URL: ${{ inputs.worker_base_url }}
          JOB_ID: ${{ steps.status.outputs.job_id }}
          GOVERNANCE_REF: ${{ steps.status.outputs.governance_ref }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/refresh.json"
          expires_at="$(date -u -d '+55 minutes' '+%Y-%m-%dT%H:%M:%SZ')"

          payload="$(jq -n             --arg job_id "$JOB_ID"             --arg governance_ref "$GOVERNANCE_REF"             --arg expires_at "$expires_at"             '{
              job_id:$job_id,
              drive_access_token:("x" * 64),
              drive_token_expires_at:$expires_at,
              governance_ref:$governance_ref,
              authority_snapshot:{}
            }'
          )"

          http_status="$(
            curl --silent --show-error               --output "$response_file"               --write-out "%{http_code}"               --request POST               --header "Authorization: Bearer $EXECUTOR_INGEST_SECRET"               --header "Content-Type: application/json"               --data "$payload"               "${WORKER_BASE_URL%/}/internal/refresh?mode=scheduled"
          )"

          error_code="$(jq -r '.error // "UNKNOWN"' "$response_file")"
          if [ "$http_status" != "409" ] || [ "$error_code" != "JOB_STATE_REJECTED" ]; then
            echo "::error::Expected 409 JOB_STATE_REJECTED, got HTTP $http_status ($error_code)"
            exit 1
          fi

          echo "Scheduled refresh readiness PASS"
          echo "No credential, authority, Meta, or Instagram mutation occurred."

      - name: Report readiness
        run: |
          {
            echo "## SDOH scheduled pilot readiness"
            echo
            echo "- Manual PUBLISHING_ENABLED window: CLOSED"
            echo "- Scheduled Worker kill switch: ACTIVE"
            echo "- Scheduled execute route: reachable and fail-closed on terminal job"
            echo "- Scheduled refresh route: reachable and fail-closed on terminal job"
            echo "- Meta/Instagram publish attempt: NONE"
            echo "- Ready to enable the GitHub scheduler variable for the approved future target"
          } >> "$GITHUB_STEP_SUMMARY"
